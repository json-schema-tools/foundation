name: Lint
'on':
  workflow_call:
    inputs:
      lint-command:
        type: string
        default: npm run lint -- --no-fix
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint
      env:
        COMMAND: ${{ inputs.lint-command }}
      run: bash -eo pipefail -c "$COMMAND"
