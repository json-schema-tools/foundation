name: Foundation release
'on':
  workflow_run:
    workflows:
    - CI
    types:
    - completed
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: foundation-release-master
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name
      == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
    - name: Create release PR
      id: release
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target-branch: master
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - name: Run CI on the release PR
      if: steps.release.outputs.pr != ''
      uses: actions/github-script@v7
      env:
        RELEASE_PR: ${{ steps.release.outputs.pr }}
      with:
        script: "const pr = JSON.parse(process.env.RELEASE_PR);\nawait github.rest.actions.createWorkflowDispatch({\n  ...context.repo,\n\
          \  workflow_id: 'ci.yml',\n  ref: pr.headBranchName\n});\n"
