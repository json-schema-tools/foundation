name: Release
'on':
  workflow_call:
    inputs:
      build-command:
        type: string
        default: npm run build
      test-command:
        type: string
        default: npm test -- --runInBand
      docs-command:
        type: string
        default: ''
      node-options:
        type: string
        default: ''
      rust-tests:
        type: boolean
        default: false
      publish-npm:
        type: boolean
        default: true
      pages-path:
        type: string
        default: ''
      release-assets:
        type: string
        default: '[]'
      deploy-schema:
        type: boolean
        default: false
      aws-region:
        type: string
        default: us-west-2
      schema-source:
        type: string
        default: src/schema.json
      schema-destination:
        type: string
        default: ''
      cloudfront-distribution:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name
      == github.repository
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
      pages: write
    steps:
    - name: Create release PR
      id: release
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target-branch: master
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - name: Run CI on the release PR
      if: steps.release.outputs.pr != ''
      uses: actions/github-script@v7
      env:
        RELEASE_PR: ${{ steps.release.outputs.pr }}
      with:
        script: "const pr = JSON.parse(process.env.RELEASE_PR);\nawait github.rest.actions.createWorkflowDispatch({\n  ...context.repo,\n\
          \  workflow_id: 'ci.yml',\n  ref: pr.headBranchName\n});\n"
    - name: Checkout released version
      if: steps.release.outputs.release_created == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.release.outputs.tag_name }}
        fetch-depth: 0
    - name: Setup Node.js
      if: steps.release.outputs.release_created == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
    - name: Use npm with trusted publishing support
      if: steps.release.outputs.release_created == 'true'
      run: npm install --global npm@11
    - name: Install dependencies
      if: steps.release.outputs.release_created == 'true'
      run: npm ci
    - name: Build
      if: steps.release.outputs.release_created == 'true'
      run: bash -eo pipefail -c "$COMMAND"
      env:
        COMMAND: ${{ inputs.build-command }}
    - name: Test released version
      if: steps.release.outputs.release_created == 'true'
      run: bash -eo pipefail -c "$COMMAND"
      env:
        COMMAND: ${{ inputs.test-command }}
    - name: Build docs
      if: steps.release.outputs.release_created == 'true' && inputs.docs-command != ''
      env:
        COMMAND: ${{ inputs.docs-command }}
      run: bash -eo pipefail -c "$COMMAND"
    - name: Test generated Rust bindings
      if: steps.release.outputs.release_created == 'true' && inputs.rust-tests
      run: cargo test
    - name: Upload generated release assets
      if: steps.release.outputs.release_created == 'true' && inputs.release-assets != '[]'
      uses: actions/github-script@v7
      env:
        RELEASE_ID: ${{ steps.release.outputs.id }}
        RELEASE_ASSETS: ${{ inputs.release-assets }}
      with:
        script: "const fs = require('fs');\nfor (const name of JSON.parse(process.env.RELEASE_ASSETS)) {\n  await github.rest.repos.uploadReleaseAsset({\n\
          \    ...context.repo,\n    release_id: Number(process.env.RELEASE_ID),\n    name,\n    data: fs.readFileSync(name)\n\
          \  });\n}\n"
    - name: Publish
      if: steps.release.outputs.release_created == 'true' && inputs.publish-npm
      run: npm publish --access public
    - name: Authenticate to crates.io
      if: steps.release.outputs.release_created == 'true' && inputs.rust-tests
      id: crates
      uses: rust-lang/crates-io-auth-action@v1
    - name: Publish Rust crate
      if: steps.release.outputs.release_created == 'true' && inputs.rust-tests
      run: cargo publish --locked --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
    - name: Authenticate to AWS
      if: steps.release.outputs.release_created == 'true' && inputs.deploy-schema
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        aws-region: ${{ inputs.aws-region }}
    - name: Deploy schema and invalidate CDN
      if: steps.release.outputs.release_created == 'true' && inputs.deploy-schema
      run: 'aws s3 cp "$SCHEMA_SOURCE" "$SCHEMA_DESTINATION"

        aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"'
      env:
        SCHEMA_SOURCE: ${{ inputs.schema-source }}
        SCHEMA_DESTINATION: ${{ inputs.schema-destination }}
        DISTRIBUTION: ${{ inputs.cloudfront-distribution }}
    - name: Upload Pages artifact
      if: steps.release.outputs.release_created == 'true' && inputs.pages-path != ''
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.pages-path }}
    - name: Deploy Pages
      if: steps.release.outputs.release_created == 'true' && inputs.pages-path != ''
      uses: actions/deploy-pages@v4
    env:
      NODE_OPTIONS: ${{ inputs.node-options }}
